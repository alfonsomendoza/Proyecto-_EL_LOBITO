server {
    listen 80;
    server_name localhost;

    # Laravel debe publicarse desde public, nunca desde la ra?z del proyecto.
    root /var/www/html/public;
    index index.php;
    charset utf-8;

    # No permitir listado de directorios.
    autoindex off;

    # Enviar las peticiones a Laravel cuando el archivo no exista.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Procesar PHP mediante PHP-FPM.
    location ~ \.php$ {
        try_files $uri =404;

        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
    }

    # Bloquear archivos ocultos, excepto los necesarios para ACME.
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
